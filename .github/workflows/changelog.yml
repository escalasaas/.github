name: Changelog

on:
  workflow_call:
    inputs:
      service:
        description: "Service name shown in the changelog title"
        required: true
        type: string

jobs:
  changelog:
    name: Post changelog
    # Off since 19/10/2026: the gmud-vigia on the VPS (infra repo) announces every deploy in
    # the deploys channel, from what is actually running (version, PR, who merged, health).
    # This webhook died on 15/10 and every deploy showed a red job; a skipped job also stops
    # taking a VPS runner for a full-history clone. Set the org variable
    # CHANGELOG_DISCORD=on (with a working DISCORD_CHANGELOG_WEBHOOK_URL) to bring it back.
    if: vars.CHANGELOG_DISCORD == 'on'
    runs-on: self-hosted
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect deployed commits
        id: commits
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -Eq '^0+$' \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git log --no-merges --pretty='- %s' "$BEFORE..${{ github.sha }}" > commits.txt
          else
            git log --no-merges -1 --pretty='- %s' "${{ github.sha }}" > commits.txt
          fi
          if [ -s commits.txt ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post to Discord
        if: steps.commits.outputs.skip == 'false'
        run: |
          head -c 3900 commits.txt > desc.txt
          jq -n --rawfile desc desc.txt \
            --arg title "🚀 ${{ inputs.service }} em produção" \
            --arg footer "${GITHUB_SHA::7} · $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')" \
            '{embeds: [{title: $title, description: $desc, color: 5763719, footer: {text: $footer}}]}' \
            > payload.json
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d @payload.json "${{ secrets.DISCORD_CHANGELOG_WEBHOOK_URL }}"
